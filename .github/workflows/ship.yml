name: ship

# Every push to main is verified end to end and then deployed automatically.
# Pushes to ci-test/** branches run the same verification without deploying.

on:
  push:
    branches: [main, "ci-test/**"]
    # None of these touch the app: run-now only starts maintenance; the rest are the
    # watchdog and repair tooling, tested by ops-tests.yml instead of redeploying the app.
    paths-ignore:
      - "ops/maint/run-now"
      - "ops/watchdog/**"
      - "ops/incident/**"
      - ".github/workflows/incident.yml"
      - ".github/workflows/watchdog-*.yml"
      - ".github/workflows/ops-tests.yml"
      - "tests/test_incident_*.py"
      - "tests/test_watchdog_*.py"
      - "ops/report/**"
      - ".github/workflows/*-report.yml"
      - "tests/test_daily_report.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      sha: ${{ github.sha }}

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
