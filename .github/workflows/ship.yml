name: ship

# Every push to main is verified end to end and then deployed automatically.
# Pushes to ci-test/** branches run the same verification without deploying.

on:
  push:
    branches: [main, "ci-test/**"]
    # None of these touch the app: run-now only starts maintenance; the rest are the
    # watchdog and repair tooling, tested by ops-tests.yml instead of redeploying the app.
    paths-ignore:
      - "ops/maint/run-now"
      - "docs/**"
      - "ops/watchdog/**"
      - "ops/incident/**"
      - ".github/workflows/incident.yml"
      - ".github/workflows/watchdog-*.yml"
      - ".github/workflows/ops-tests.yml"
      - "tests/test_incident_*.py"
      - "tests/test_watchdog_*.py"
      - "ops/report/**"
      - ".github/workflows/*-report.yml"
      - "tests/test_daily_report.py"
      - "ops/loadtest.py"
      - "ops/mcp_loadtest.py"
      - ".github/workflows/compile-load-test.yml"
      - ".github/workflows/load-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      sha: ${{ github.sha }}

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}

  # The public pages are cached at Cloudflare for hours (see asgi._EDGE_CACHED), so a deploy
  # that changes their wording is invisible until the cache expires. Clear just those pages.
  clear-page-cache:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: watchdog-deploy
    permissions:
      contents: read
    steps:
      - name: Clear the cached public pages at Cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pages='"https://milatexai.com/","https://milatexai.com/privacy","https://milatexai.com/terms","https://milatexai.com/help","https://milatexai.com/tools","https://milatexai.com/tools/bibtex","https://milatexai.com/tools/latex-error-finder","https://milatexai.com/llms.txt","https://milatexai.com/sitemap.xml"'
          code=$(curl -s -o /tmp/purge.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/1378686c9478bd4880bca1288ead3079/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"files\":[$pages]}")
          echo "Cloudflare answered $code: $(head -c 300 /tmp/purge.json)"
          [ "$code" = "200" ] || echo "::warning::could not clear the page cache; pages update when the cache expires"
