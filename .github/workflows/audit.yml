name: security-audit

# Daily check of the exact pinned dependencies against known-vulnerability
# databases. A finding does not wait for the weekly run: it triggers the
# maintenance workflow immediately, which fixes, verifies, and ships.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pip-audit
      - id: scan
        run: |
          set +e
          pip-audit -r requirements.txt --require-hashes --disable-pip | tee audit.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Vulnerability found, start maintenance now
        if: steps.scan.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run maintain.yml --repo "${{ github.repository }}" -f reason=security-audit
