name: verify

# Reusable quality gate. Nothing ships unless all three stages pass:
#   1. unit: the full test suite on the pinned, hashed dependency set
#   2. image: builds the production image and publishes it by commit SHA
#   3. e2e: the end-to-end journeys run INSIDE that exact image, with the real
#      LaTeX engine required (a missing engine fails, it does not skip)

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to verify
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest tests -q -p no:cacheprovider

  image-and-e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: End-to-end journeys inside the production image
        run: |
          docker run --rm -e E2E_REQUIRE_LATEX=1 \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            ghcr.io/${{ github.repository }}:${{ inputs.sha }} \
            sh -c "pip install -q --require-hashes -r requirements-dev.txt && python -m pytest tests/e2e -q -p no:cacheprovider -rs"
