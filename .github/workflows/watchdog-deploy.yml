name: watchdog-deploy

# Publishes the Cloudflare watchdog (ops/watchdog/worker.js) when it changes on main,
# after its unit tests pass. The deploy script is safe to re-run (ops/watchdog/deploy.py).

on:
  push:
    branches: [main]
    paths: ["ops/watchdog/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: watchdog-deploy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r requirements-dev.txt
      - run: python -m pytest tests/test_watchdog_logic.py -q -p no:cacheprovider
      - name: Publish the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
          WATCHDOG_REPORT_SECRET: ${{ secrets.WATCHDOG_REPORT_SECRET }}
        run: python ops/watchdog/deploy.py
